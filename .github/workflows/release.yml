name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: npm ci
      - run: npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p backend/cmd/wede/dist
          cp -r dist/* backend/cmd/wede/dist/

          VERSION="${GITHUB_REF_NAME}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          go build -tags embed_frontend \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o "wede-${GOOS}-${GOARCH}${EXT}" ./backend/cmd/wede

          rm -rf backend/cmd/wede/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wede-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wede-*

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: release_tag
        run: |
          TAG_NAME=""
          if [ -n "${GITHUB_EVENT_PATH:-}" ]; then
            TAG_NAME=$(jq -r '.release.tag_name // empty' "$GITHUB_EVENT_PATH")
          fi
          if [ -z "$TAG_NAME" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
          fi
          if [ -z "$TAG_NAME" ] && [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG_NAME" ]; then
            echo "error: could not resolve release tag" >&2
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum wede-* > checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          TAG_NAME="${{ steps.release_tag.outputs.tag_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG_NAME" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG_NAME" --no-merges)
            {
              echo "body<<EOF"
              echo "## What's Changed"
              echo ""
              echo "$CHANGES"
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: ${{ steps.release_tag.outputs.release_name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          draft: false
          files: |
            artifacts/wede-*
            artifacts/checksums.txt
